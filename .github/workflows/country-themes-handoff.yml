name: Materialize Chessy Atlas candidate

on:
  push:
    branches:
      - feat/country-themes-release

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.head_commit.message == 'Initialize country themes handoff'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download exact candidate patch
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 'https://chessy.textilesdemedellin.com/country-themes-handoff-1788808824-2527.patch.gz' -o /tmp/chessy-country-themes.patch.gz
          echo 'd6f16a0caa21f2966b9e342c06e41aeee02dd4002b359f773835ddc036959817  /tmp/chessy-country-themes.patch.gz' | sha256sum -c -
          gzip -dc /tmp/chessy-country-themes.patch.gz > /tmp/chessy-country-themes.patch
      - name: Apply and verify candidate product tree
        run: |
          set -euo pipefail
          git apply --check /tmp/chessy-country-themes.patch
          git apply /tmp/chessy-country-themes.patch
          git add -A
          git rm --cached .github/workflows/country-themes-handoff.yml
          actual=$(git write-tree)
          test "$actual" = '2c2c13f1f81a9cec5422f9718a69f7c749c4cde0'
          git add .github/workflows/country-themes-handoff.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Materialize verified Chessy Atlas candidate'
          git push origin HEAD:feat/country-themes-release
