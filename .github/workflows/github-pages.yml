name: Transport verified Chessy auth candidate

on:
  push:
    branches: ['feat/pwa-auth-native-readiness-v1']

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize exact verified tree except workflow
        shell: bash
        run: |
          set -euo pipefail
          PATCH=/tmp/chessy-auth-v1.patch
          curl --fail --silent --show-error --location --max-time 30 \
            https://chessy.textilesdemedellin.com/__release/auth-v1-e0103b8.patch \
            -o "$PATCH"
          echo 'da567ac6bc0f1dff5ef4ca6e12756498c83b530d7c9b8892601497aaa474dd7d  /tmp/chessy-auth-v1.patch' | sha256sum -c -
          git apply --check --exclude=.github/workflows/github-pages.yml "$PATCH"
          git apply --exclude=.github/workflows/github-pages.yml "$PATCH"
          git add -A
          TREE=$(git write-tree)
          echo "materialized_tree=$TREE"
          git config user.name 'OpenAI Release Bot'
          git config user.email 'openai@users.noreply.github.com'
          git commit -m 'feat: materialize verified Chessy auth candidate'
          git push origin HEAD:feat/pwa-auth-native-readiness-v1
