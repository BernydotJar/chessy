name: Apply Chessy UI Kit v2 handoff

on:
  push:
    branches:
      - feat/ui-kit-v2-20260906

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download verified handoff patch
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location --retry 3 \
            https://chessy.textilesdemedellin.com/chessy-ui-kit-v2-handoff.patch \
            -o /tmp/chessy-ui-kit-v2.patch
          echo "da08e45b7dda9c0aef7b958c6ae4da9bec76e7dbe6be8aad2f904520096cd12c  /tmp/chessy-ui-kit-v2.patch" | sha256sum -c -
      - name: Apply source tree and remove handoff workflow
        shell: bash
        run: |
          set -euo pipefail
          git apply --index /tmp/chessy-ui-kit-v2.patch
          rm .github/workflows/apply-ui-kit-v2-handoff.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: apply Chessy UI kit and visual themes"
          git push origin HEAD:${GITHUB_REF_NAME}
