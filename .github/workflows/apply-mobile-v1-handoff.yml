name: Apply Chessy Mobile v1 handoff

on:
  push:
    branches: ['feat/mobile-product-v1-icons-v3']
    paths: ['.github/workflows/apply-mobile-v1-handoff.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch SHA-bound verified patch
        run: |
          curl -fsSL https://chessy.textilesdemedellin.com/chessy-mobile-v1-handoff.patch -o /tmp/chessy-mobile-v1.patch
          echo '1c7066f0e4280e8fb38eac887e269aa5cdd2fe8dc6001719072fb7efcc03e0a3  /tmp/chessy-mobile-v1.patch' | sha256sum -c -
      - name: Stage exact candidate tree
        run: |
          git apply --binary /tmp/chessy-mobile-v1.patch
          rm -f .github/workflows/apply-mobile-v1-handoff.yml
          git add -A
          git diff --cached --check
          test "$(git write-tree)" = '03c496e48fcdb58b0d1bf1c9a83e5964e92b2e1b'
      - name: Upload exact tree objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess, urllib.request
          owner='BernydotJar'; repo='chessy'
          base='6145963d1bb819cb53ffd29208c31beb0078e57c'
          base_tree='62c7bd104cfb608a6f2a633db1b60b44cfd1381d'
          expected='03c496e48fcdb58b0d1bf1c9a83e5964e92b2e1b'
          token=os.environ['GH_TOKEN']
          def api(path, body):
              data=json.dumps(body).encode()
              req=urllib.request.Request(f'https://api.github.com/repos/{owner}/{repo}/{path}',data=data,method='POST',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
              with urllib.request.urlopen(req) as r: return json.load(r)
          entries=[]
          lines=subprocess.check_output(['git','diff','--name-status',base],text=True).splitlines()
          for line in lines:
              status,path=line.split('\t',1)
              if status=='D':
                  entries.append({'path':path,'mode':'100644','type':'blob','sha':None}); continue
              raw=pathlib.Path(path).read_bytes()
              blob=api('git/blobs',{'content':base64.b64encode(raw).decode(),'encoding':'base64'})
              index=subprocess.check_output(['git','ls-files','-s','--',path],text=True).split()
              assert blob['sha']==index[1], (path,blob['sha'],index[1])
              entries.append({'path':path,'mode':index[0],'type':'blob','sha':blob['sha']})
          tree=api('git/trees',{'base_tree':base_tree,'tree':entries})
          assert tree['sha']==expected,(tree['sha'],expected)
          print(json.dumps({'uploaded_tree':tree['sha'],'entries':len(entries)}))
          PY
