name: Materialize verified Chessy Mobile candidate

on:
  push:
    branches: ['feat/mobile-product-v1-icons-v3']
    paths: ['.github/workflows/contents-materialize-mobile.yml']

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and verify exact candidate tree
        run: |
          curl -fsSL https://chessy.textilesdemedellin.com/chessy-mobile-vector-final.patch -o /tmp/candidate.patch
          curl -fsSL https://chessy.textilesdemedellin.com/chessy-mobile-vector-identity.json -o /tmp/candidate.json
          git apply /tmp/candidate.patch
          rm -f .github/workflows/apply-mobile-v1-handoff.yml .github/workflows/contents-materialize-mobile.yml
          git add -A
          ACTUAL_TREE="$(git write-tree)"
          EXPECTED_TREE="$(python3 -c 'import json; print(json.load(open("/tmp/candidate.json"))["tree"])')"
          test "$ACTUAL_TREE" = "$EXPECTED_TREE"
          echo "Verified exact candidate tree: $ACTUAL_TREE"
      - name: Materialize candidate files through GitHub Contents API
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: feat/mobile-product-v1-icons-v3
          BASE: 6145963d1bb819cb53ffd29208c31beb0078e57c
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess, urllib.error, urllib.parse, urllib.request
          owner='BernydotJar'; repo='chessy'; branch=os.environ['BRANCH']; base=os.environ['BASE']; token=os.environ['GH_TOKEN']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}
          def req(method,path,body=None):
              url=f'https://api.github.com/repos/{owner}/{repo}/{path}'
              data=None if body is None else json.dumps(body).encode()
              r=urllib.request.Request(url,data=data,method=method,headers=headers)
              try:
                  with urllib.request.urlopen(r) as resp: return resp.status, json.load(resp)
              except urllib.error.HTTPError as e:
                  if e.code==404: return 404, None
                  print(e.read().decode(), flush=True); raise
          lines=subprocess.check_output(['git','diff','--name-status',base],text=True).splitlines()
          changed=[]
          for line in lines:
              parts=line.split('\t'); status=parts[0]; path=parts[-1]
              if path.startswith('.github/workflows/') and path in {'.github/workflows/apply-mobile-v1-handoff.yml','.github/workflows/contents-materialize-mobile.yml'}:
                  continue
              changed.append((status,path))
          print(f'Materializing {len(changed)} candidate paths',flush=True)
          for index,(status,path) in enumerate(changed,1):
              encoded_path=urllib.parse.quote(path,safe='/')
              _, current=req('GET',f'contents/{encoded_path}?ref={urllib.parse.quote(branch,safe="")}')
              if status=='D':
                  if current:
                      req('DELETE',f'contents/{encoded_path}',{'message':f'chore: remove superseded {path}','sha':current['sha'],'branch':branch})
                  print(f'{index}/{len(changed)} D {path}',flush=True); continue
              raw=pathlib.Path(path).read_bytes()
              raw.decode('utf-8')
              body={'message':f'feat: mobile v1 sync {path}','content':base64.b64encode(raw).decode(),'branch':branch}
              if current: body['sha']=current['sha']
              req('PUT',f'contents/{encoded_path}',body)
              print(f'{index}/{len(changed)} {status} {path}',flush=True)
          PY
