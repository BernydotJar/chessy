[supervisord]
nodaemon=true
logfile=/workspace/projects/chessy/progress/runtime/supervisord.log
pidfile=/workspace/projects/chessy/progress/runtime/supervisord.pid

[program:chessy]
directory=/workspace/projects/chessy
command=/usr/bin/env node /workspace/projects/chessy/scripts/serve-production.mjs
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/projects/chessy/progress/runtime/chessy.stdout.log
stderr_logfile=/workspace/projects/chessy/progress/runtime/chessy.stderr.log
environment=PORT="14176",HOST="0.0.0.0"
